        var b0 = bin.read();

        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;

        count += 1;

        throw count + ' != ' + numChars;
      }

      return unicodeMap;

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {

          }

:root{

  --danger:#ef4444;

  --info:#0891b2;

  --shadow-md:0 10px 28px rgba(0,0,0,.28);
  --shadow-lg:0 24px 56px rgba(0,0,0,.45);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:var(--maroon-deep);
  background-image:radial-gradient(circle at 15% 0%, rgba(201,168,76,.06), transparent 45%),

  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Inter',sans-serif;margin:0;font-weight:800;}

button{font-family:inherit;cursor:pointer;}

a{color:inherit;text-decoration:none;}

}

}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff;}

  border-color:rgba(201,168,76,.3);

}

}

  backdrop-filter:blur(8px);
}

.topbar h2{font-size:13.5px;color:#fff;font-weight:800;}

.topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px;}
.icon-btn{

  color:var(--gold-light);position:relative;font-size:19px;
  transition:background .15s, color .15s, transform .15s;

.icon-btn:hover{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:var(--maroon-900);transform:translateY(-1px);}

.admin-chip{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border:1px solid var(--line);border-radius:30px;background:rgba(255,255,255,.05);}
.admin-chip:hover{background:rgba(255,255,255,.09);}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:var(--maroon-900);display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:900;flex-shrink:0;}
.admin-chip .name{font-size:13.5px;font-weight:700;line-height:1.2;color:#fff;}
.admin-chip .role{font-size:13.5px;color:var(--cream-55);}

.content{padding:30px 40px 64px;width:100%;max-width:1600px;margin:0 auto;}
.view{display:none;animation:fadein .28s ease;}

.card{

}
.card.folder{border-left:4px solid var(--gold-dark);}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;flex-wrap:wrap;}
.card-head h3{font-size:13.5px;color:#14161a;font-weight:800;}
.card-head .hint{font-size:13.5px;color:#14161a;}

.stat{display:flex;flex-direction:column;gap:10px;}
.stat .top{display:flex;align-items:center;justify-content:space-between;}
.stat .ico{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#fff;font-size:20px;box-shadow:0 4px 12px rgba(160,120,48,.3);}

.delta.up{color:#0f9c78;background:#e7f8f3;}

.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:11px 18px;border-radius:9px;font-size:13.5px;font-weight:700;
  border:1px solid transparent;transition:filter .12s, background .12s;white-space:nowrap;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:var(--maroon-900);}

.btn-icon{width:36px;height:36px;padding:0;justify-content:center;border-radius:9px;border:1px solid #E0E3E9;background:#fff;color:#4b5563;font-size:16px;}
.btn-icon:hover{background:#F5F6F8;color:#14161a;}

.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
thead th{

.cell-name{display:flex;align-items:center;gap:10px;font-weight:700;color:#14161a;}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;font-weight:800;padding:4px 10px;border-radius:20px;}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}

.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;}

/* FIX: safety net so a JS error anywhere in this file can never again
   leave the Admin Portal showing a silent blank white screen (this is how
   the STATE-before-declaration bug was found and fixed — it hid behind a
   blank page with no clue why). If nothing renders into #app within a few
   seconds, or any uncaught error/rejection happens, show a visible
   diagnostic message with the real error instead of nothing. */
(function(){
  var shown = false;
  function showFallback(detail){
    if(shown) return; shown = true;
    var app = document.getElementById('app');
    if(!app) return;
    if(app.innerHTML.trim()) return; // something already rendered — don't clobber it
    app.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:sans-serif;background:#4A0E1A;color:#fff;box-sizing:border-box;">'
      + '<div style="max-width:520px;width:100%;background:#fff;color:#2a0a12;border-radius:14px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.4);box-sizing:border-box;">'
      + '<div style="font-weight:800;font-size:18px;margin-bottom:8px;">Admin Portal failed to load</div>'
      + '<div style="font-size:13.5px;line-height:1.6;margin-bottom:14px;">Something went wrong before the dashboard could render. Please screenshot the message below and send it to the developer — it pinpoints exactly what broke.</div>'
      + '<pre style="white-space:pre-wrap;font-size:12px;background:#f6f0e9;padding:12px;border-radius:8px;max-height:220px;overflow:auto;margin:0;">' + String(detail || 'Unknown error').replace(/</g,'&lt;') + '</pre>'
      + '<button onclick="location.reload()" style="margin-top:14px;padding:10px 18px;border:none;border-radius:8px;background:#6B1A2A;color:#fff;font-weight:700;cursor:pointer;">Reload</button>'
      + '</div></div>';
  }
  window.addEventListener('error', function(e){
    showFallback((e.message || 'Script error') + (e.filename ? ('\n at ' + e.filename + ':' + e.lineno + ':' + e.colno) : ''));
  });
  window.addEventListener('unhandledrejection', function(e){
    var r = e.reason;
    showFallback('Unhandled promise rejection: ' + (r && r.stack ? r.stack : (r && r.message) || String(r)));
  });
  setTimeout(function(){
    var app = document.getElementById('app');
    if(app && !app.innerHTML.trim()){
      showFallback('The app never rendered anything within 8 seconds. Common causes: the Firebase SDK scripts failed to load (network/CDN/ad-blocker), the firebaseConfig/API key is invalid, or Firestore security rules are blocking the initial read. Open DevTools \u2192 Console for the exact underlying error.');
    }
  }, 8000);
})();
</script>

const BACKEND_URL = "https://snedlink-backend.onrender.com"; // no trailing slash, e.g. https://snedlink-backend.onrender.com
async function slApiCall(path, method, body) {
  const token = auth.currentUser ? await auth.currentUser.getIdToken() : null;
  if (!token) throw new Error('You must be signed in.');
  const res = await fetch(BACKEND_URL + path, {
    method,
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: body !== undefined ? JSON.stringify(body) : undefined
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((data.error && data.error.message) || ('Request failed (' + res.status + ')'));
  return data;
}

let fbApp, auth, db, messaging, functionsClient;
/* FIX: if the Firebase CDN <script> tags above (firebase-app-compat.js etc.)

/* ---------------- Firestore <-> STATE real-time sync ----------------
   Every collection below is mirrored live into STATE.<key>. Any write
   from this admin (or any other admin, on any device) is reflected
   here automatically the moment Firestore confirms it — no manual
   refresh, no local-only mutation.
   ------------------------------------------------------------ */
const FIRESTORE_COLLECTIONS = [
  {col:'teachers',            key:'teachers',            order:'name'},
  {col:'parents',             key:'parents',             order:'name'},
  {col:'alerts',               key:'alerts',              order:'createdAt', desc:true},
  {col:'students',            key:'students',            order:'name'},
  {col:'assignments',         key:'assignments',         order:null},
  {col:'notifications',       key:'notifications',       order:'time', desc:true},
  {col:'audit',                key:'audit',               order:'time', desc:true},
  {col:'failedLogins',        key:'failedLogins',        order:'last', desc:true},
  {col:'backups',              key:'backups',             order:'date', desc:true},
  {col:'ieps',                 key:'ieps',                order:null},
  {col:'iepDocs',              key:'iepDocs',             order:null},
  {col:'teacherActivations',  key:'teacherActivations',  order:'createdAt', desc:true},
  {col:'parentActivations',   key:'parentActivations',   order:'createdAt', desc:true},
  {col:'emailLog',             key:'emailLog',            order:'time', desc:true},
  {col:'teacherEmailLog',     key:'teacherEmailLog',     order:'time', desc:true},
  {col:'archived',             key:'archived',            order:'archivedAt', desc:true},
  {col:'parentRequests',      key:'parentRequests',      order:'createdAt', desc:true},
];
let firestoreUnsubscribers = [];
function startRealtimeSync(){
  stopRealtimeSync();
  FIRESTORE_COLLECTIONS.forEach(c=>{
    let ref = db.collection(c.col);
    if(c.order) ref = ref.orderBy(c.order, c.desc ? 'desc' : 'asc');
    const unsub = ref.onSnapshot(snap=>{
      STATE[c.key] = snap.docs.map(d=>({id:d.id, ...d.data()}));
      if(STATE.session.loggedIn) softRefresh();
    }, err=>{
      console.error(`Firestore sync failed for "${c.col}":`, err);
    });
    firestoreUnsubscribers.push(unsub);
  });
  // Settings are single documents
  const settingsUnsub = db.collection('settings').doc('main').onSnapshot(doc=>{
    if(doc.exists) STATE.settings = doc.data();
    if(STATE.session.loggedIn) softRefresh();
  }, err=>console.error('Firestore sync failed for "settings":', err));
  firestoreUnsubscribers.push(settingsUnsub);
  const iepSettingsUnsub = db.collection('settings').doc('iep').onSnapshot(doc=>{
    if(doc.exists) STATE.iepSettings = {...STATE.iepSettings, ...doc.data()};
    if(STATE.session.loggedIn) softRefresh();
  }, err=>console.error('Firestore sync failed for "settings/iep":', err));
  firestoreUnsubscribers.push(iepSettingsUnsub);
}

/* ── NOTE: activation finalization ─────────────────────────────────────

   (accountService.js) does all of this synchronously, server-side, with

/* ============================================================
   PUSH NOTIFICATIONS (Firebase Cloud Messaging) — shared with the
   Teacher and Parent portals. Device tokens live on the SAME
   users/{uid}.fcmTokens field the other two portals use, so the one
   shared Cloud Function (onAlertCreated / onNotificationCreated in
   functions/index.js) can push to admin, teacher, and parent devices
   from the exact same code path.
   ============================================================ */
function pushSupported(){ return typeof Notification !== 'undefined' && 'serviceWorker' in navigator && !!messaging; }

async function initPushAuto(){
  if(!pushSupported()) return;
  STATE.push.permission = Notification.permission;
  if(Notification.permission === 'granted'){
    try{ await registerPushDevice(); }catch(e){ console.warn('Push auto-registration failed:', e); }
  }
  listenForForegroundPush();
}
async function enablePushNotifications(){
  if(!pushSupported()){ toast('Push notifications are not supported in this browser.','danger'); return; }
  try{
    const perm = await Notification.requestPermission();
    STATE.push.permission = perm;
    if(perm !== 'granted'){
      toast('Push notifications were not enabled. You can allow them anytime in your browser\'s site settings.','danger');
      refreshView('profile'); return;
    }
    await registerPushDevice();
    toast('Push notifications enabled on this device.','success');
    logAudit(STATE.admin.name||'Admin','Enable','Push Notifications','Enabled push notifications for this device');
  }catch(err){ toast('Could not enable push notifications: '+err.message,'danger'); }
  refreshView('profile');
}
async function registerPushDevice(){
  if(!pushSupported() || STATE.push.registering) return;
  STATE.push.registering = true;
  try{
    const reg = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
    const token = await messaging.getToken({ vapidKey: SL_VAPID_KEY, serviceWorkerRegistration: reg });
    if(token){
      STATE.push.token = token;
      await db.collection('users').doc(auth.currentUser.uid).set({
        fcmTokens: firebase.firestore.FieldValue.arrayUnion(token)
      }, {merge:true});
    }
  } finally { STATE.push.registering = false; }
}
async function disablePushNotifications(){
  try{
    if(STATE.push.token){
      await db.collection('users').doc(auth.currentUser.uid).update({
        fcmTokens: firebase.firestore.FieldValue.arrayRemove(STATE.push.token)
      }).catch(()=>{});
      if(messaging && messaging.deleteToken) await messaging.deleteToken().catch(()=>{});
    }
    STATE.push.token = null;
    toast('Push notifications turned off for this device.','info');
    logAudit(STATE.admin.name||'Admin','Disable','Push Notifications','Disabled push notifications for this device');
  }catch(err){ toast('Failed to disable: '+err.message,'danger'); }
  refreshView('profile');
}
let foregroundPushBound = false;
function listenForForegroundPush(){
  if(!messaging || foregroundPushBound) return;
  foregroundPushBound = true;
  messaging.onMessage(payload=>{
    const data = payload.data || {}, notif = payload.notification || {};
    const title = notif.title || 'SNED-LINK+', body = notif.body || '';
    playAlertSound(true); vibrateDevice(true);
    toast(title + ' — ' + body, 'danger');
    if(Notification.permission === 'granted'){
      try{
        const n = new Notification(title, { body, tag:'snedlink-'+Date.now(), renotify:true, requireInteraction:true });
        n.onclick = ()=>{ window.focus(); n.close(); navigate('notifications'); };
      }catch(e){}
    }
  });
}
let pushAudioCtx = null;
function playAlertSound(critical){
  try{
    pushAudioCtx = pushAudioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(pushAudioCtx.state === 'suspended') pushAudioCtx.resume();
    const notes = critical ? [880,660,880,660,880] : [660,880,990];
    notes.forEach((f,i)=>{
      const o = pushAudioCtx.createOscillator(), g = pushAudioCtx.createGain();
      o.type='sine'; o.frequency.value=f;
      const t = pushAudioCtx.currentTime + i*0.22;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.35,t+0.03); g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
      o.connect(g); g.connect(pushAudioCtx.destination); o.start(t); o.stop(t+0.22);
    });
  }catch(e){}
}
function vibrateDevice(critical){ try{ if(navigator.vibrate) navigator.vibrate(critical?[300,150,300,150,300,150,300]:[200,100,200]); }catch(e){} }

/* Re-renders whatever view is currently on screen — called whenever

  document.getElementById('content').innerHTML = renderFn();

  const nc = document.getElementById('notif-count');

}

/* ---- Parent–Student Link Verification: automatic validation, run before any activation link/QR/email is generated ---- */
function validateActivationLink(r){
  const student = STATE.students.find(s=>s.id===r.linkedStudentId);
  const parent = STATE.parents.find(p=>p.id===r.parentRecordId);
  const duplicate = STATE.parentActivations.some(x=>x.id!==r.id && x.linkedStudentId && x.linkedStudentId===r.linkedStudentId && x.relationship===r.relationship);
  const emailDuplicate = STATE.parentActivations.some(x=>x.id!==r.id && x.email.toLowerCase()===r.email.toLowerCase());
  const list = [
    {label:'Student record exists', pass: !!student},
    {label:'Parent record exists', pass: !!parent},
    {label:'Parent is linked to the selected student', pass: !!r.linkedStudentId},
    {label:'Relationship has been verified', pass: !!(r.linkVerified && r.relationship)},
    {label:'No duplicate assignment exists', pass: !duplicate},
    {label:'Parent account is not archived', pass: r.accountStatus!=='Archived'},
    {label:'Student account is active', pass: !!student},
    {label:'Parent email is unique', pass: !emailDuplicate},
  ];
  return {ok: list.every(c=>c.pass), list};
}

}
/* Deterministic pseudo-QR preview generated from a token (visual mock — no real backend/QR lib) */
function qrSvg(data, size=132){
  try{
    const typeNumber = 0; // 0 = auto-detect smallest size that fits the data
    const qr = qrcode(typeNumber, 'M');
    qr.addData(String(data));
    qr.make();
    const count = qr.getModuleCount();
    const cs = size / count;
    let rects = '';
    for (let y=0; y<count; y++){
      for (let x=0; x<count; x++){
        if(qr.isDark(y,x)) rects += `<rect x="${(x*cs).toFixed(2)}" y="${(y*cs).toFixed(2)}" width="${cs.toFixed(2)}" height="${cs.toFixed(2)}" fill="#14161a"/>`;
      }
    }
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="background:#fff;border-radius:8px;">${rects}</svg>`;
  }catch(e){
    console.error('QR generation failed:', e);
    return `<div style="width:${size}px;height:${size}px;display:flex;align-items:center;justify-content:center;background:#fdeaea;color:#a13a3a;font-size:11px;text-align:center;border-radius:8px;padding:8px;">QR generation failed</div>`;
  }
}

async function attemptLogin(){
  const email = document.getElementById('login-user').value.trim();
  const pass = document.getElementById('login-pass').value;
  if(!email || !pass){ toast('Please enter your email and password.','danger'); return; }
  try{
    await auth.signInWithEmailAndPassword(email, pass);
    // onAuthStateChanged (in boot()) takes it from here.
  }catch(err){
    toast(loginErrorMessage(err), 'danger');
  }
}
function loginErrorMessage(err){
  const map = {
    'auth/invalid-email':'That email address looks invalid.',
    'auth/user-disabled':'This account has been disabled.',
    'auth/user-not-found':'No account found with that email.',
    'auth/wrong-password':'Incorrect password.',
    'auth/invalid-credential':'Incorrect email or password.',
    'auth/email-already-in-use':'An account with that email already exists.',
    'auth/weak-password':'Password is too weak — use at least 8 characters.',
    'auth/too-many-requests':'Too many attempts. Please wait and try again.',
    'auth/network-request-failed':'Network error — check your connection.',
  };
  return map[err.code] || (err.message || 'Something went wrong. Please try again.');
}

/* ------------------------------------------------------------
   safeChart: isolated Chart.js mounting helper.
   - Looks up the canvas by id (skips quietly if not in the current view)
   - Destroys any previous Chart instance bound to that canvas first
   - Wraps construction in try/catch so one failing chart can never
     stop the rest of a page's charts from mounting
   ------------------------------------------------------------ */
function safeChart(id, config){
  const el = document.getElementById(id);
  if(!el) return null;
  try{
    const existing = (typeof Chart.getChart === 'function') ? Chart.getChart(el) : null;
    if(existing) existing.destroy();
    return new Chart(el, config);
  }catch(err){
    console.error('Chart mount failed for #'+id, err);
    return null;
  }
}

/* ------------------------------------------------------------
   Bubble chart polish plugins: soft drop-shadow under bubbles,
   and centered value labels drawn on top of each bubble.
   ------------------------------------------------------------ */
const bubbleShadowPlugin = {
  id: 'bubbleShadow',
  beforeDatasetsDraw(chart){
    const {ctx} = chart;
    ctx.save();
    ctx.shadowColor = 'rgba(20,22,26,0.22)';
    ctx.shadowBlur = 14;
    ctx.shadowOffsetY = 6;
  },
  afterDatasetsDraw(chart){
    chart.ctx.restore();
  }
};
const bubbleValueLabelPlugin = {
  id: 'bubbleValueLabel',
  afterDatasetsDraw(chart){
    const {ctx} = chart;
    chart.data.datasets.forEach((ds, i)=>{
      const meta = chart.getDatasetMeta(i);
      if(meta.hidden || !meta.data[0]) return;
      const point = meta.data[0];
      const {x,y} = point.getProps(['x','y'], true);
      const r = point.options ? point.options.radius : 0;
      const val = ds.data[0] && ds.data[0].v;
      if(val===undefined || val===null || r<10) return;
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffffff';
      ctx.font = '800 ' + Math.max(11, Math.min(18, r*0.5)) + 'px system-ui, -apple-system, sans-serif';
      ctx.fillText(String(val), x, y);
      ctx.restore();
    });
  }
};

function paginate(arr, page, pageSize){
  const total = arr.length;
  const pages = Math.max(1, Math.ceil(total/pageSize));
  page = Math.min(page, pages);
  const start = (page-1)*pageSize;
  return {rows: arr.slice(start, start+pageSize), page, pages, total};
}

function paginationBar(view, page, pages, total, count){
  let btns='';
  const windowSize=5;
  let startP = Math.max(1, page-2), endP = Math.min(pages, startP+windowSize-1);
  startP = Math.max(1, endP-windowSize+1);
  for(let p=startP;p<=endP;p++){
    btns += `<button class="${p===page?'active':''}" onclick="gotoPage('${view}',${p})">${p}</button>`;
  }
  return `
  <div class="pagination">
    <span>Showing ${count} of ${total} entries</span>
    <div class="page-btns">
      <button onclick="gotoPage('${view}',${Math.max(1,page-1)})" ${page===1?'disabled':''}>‹</button>
      ${btns}
      <button onclick="gotoPage('${view}',${Math.min(pages,page+1)})" ${page===pages?'disabled':''}>›</button>
    </div>
  </div>`;
}
function gotoPage(view,p){ TABLE_STATE[view].page=p; refreshView(view); }
function refreshView(view){
  document.getElementById('content').innerHTML = VIEW_RENDERERS[view]();
  if (VIEW_MOUNTS[view]) VIEW_MOUNTS[view]();
}

async function saveTeacher(id){
  const name=document.getElementById('f-name').value.trim();
  const email=document.getElementById('f-email').value.trim();
  const section=document.getElementById('f-section').value;
  const phone=document.getElementById('f-phone').value.trim();
  const status=document.getElementById('f-status').value;
  if(!name || !email){ toast('Please fill in the required fields.','danger'); return; }
  const setPasswordNow = !id && document.getElementById('f-password') && document.getElementById('f-password').value.trim().length > 0;
  const password = setPasswordNow ? document.getElementById('f-password').value : null;
  if(setPasswordNow && password.length < 8){ toast('Password must be at least 8 characters.','danger'); return; }
  try{
    if(id){
      await db.collection('teachers').doc(id).update({name,email,section,phone,status});
      await db.collection('users').doc(id).set({name,email,status: status==='Active'?'active':'inactive'}, {merge:true}).catch(()=>{});
      toast('Teacher updated successfully.','success');
      logAudit('Admin','Update','Teacher',`Updated ${name}`);
      closeModal();
      refreshView('teachers');
    } else {
      // Backend now handles this properly: server-side Admin SDK creates
      // the Firebase Auth account, users/{uid} login profile, teachers/{uid}
      // richer record, and the single-use teacherActivations token — all in
      // one request. When no password is set here, the account only
      // becomes real when the teacher opens the one-time link and sets
      // their own password (teacher_portal.html calls POST /api/teachers/activate).
      // If a password IS set here, the backend must create the account as
      // already-active with that password instead of issuing an activation
      // token — see note below.
      const payload = setPasswordNow ? {name,email,section,phone,password} : {name,email,section,phone};
      const res = await slApiCall('/api/admin/teachers', 'POST', payload);
      closeModal();
      refreshView('teachers');
      if(setPasswordNow){
        logAudit('Admin','Create','Teacher',`Added ${name} (password set by admin)`);
        toast(`${name} added. Share the password you set with them directly.`,'success');
      } else {
        logAudit('Admin','Create','Teacher',`Added ${name} (pending activation)`);
        showTeacherActivationResult(name, email, res.activationToken, res.activationExpires);
      }
    }
  }catch(err){ toast('Save failed: '+(err.message||err),'danger'); return; }
}
/* Shows the one-time activation code/link/QR the admin shares with the
   new teacher (email, text, printed slip — however the school does it
   today). Nothing about this is stored anywhere the teacher didn't get it
   from directly — losing it just means generating a new one. */
function showTeacherActivationResult(name, email, token, expires){
  if(!token){ toast(`${name} added, but no activation link came back — check the backend logs.`,'danger'); return; }

  const expiresStr = expires ? new Date(expires).toLocaleString() : 'in 24 hours';
  openModal(`${name} — Activation Ready`, `
    <div style="font-size:12.5px;color:rgba(0,0,0,.7);margin-bottom:10px">Share this one-time link with <b>${esc(email)}</b>. It works once and expires ${esc(expiresStr)}.</div>

const ARCHIVE_COLLECTION_MAP = {
  'Teacher':'teachers', 'Parent':'parents', 'Student':'students',
  'Parent Activation':'parentActivations', 'Teacher Activation':'teacherActivations'
};
async function sendToArchive(type, name, detail, record){
  const {id, ...data} = record;
  await db.collection('archived').add({type, name, detail, record:data, sourceId:id||null, archivedAt:new Date().toISOString()});
  const col = ARCHIVE_COLLECTION_MAP[type];
  if(col && id) await db.collection(col).doc(id).delete();
}
async function restoreArchived(archiveId){
  const item = STATE.archived.find(x=>x.id===archiveId);
  if(!item) return;
  const col = ARCHIVE_COLLECTION_MAP[item.type];
  try{
    if(col) await db.collection(col).add(item.record);
    await db.collection('archived').doc(archiveId).delete();
    toast(`${item.name} restored to ${item.type.toLowerCase()} records.`,'success');
    logAudit('Admin','Restore',item.type,`Restored ${item.name} from archive`);
  }catch(err){ toast('Restore failed: '+err.message,'danger'); }
  refreshView('archive');
}
function purgeArchived(archiveId){
  const item = STATE.archived.find(x=>x.id===archiveId);
  if(!item) return;
  confirmDialog(`Permanently delete ${item.name} from the archive? This cannot be undone.`, async ()=>{
    try{
      await db.collection('archived').doc(archiveId).delete();
      toast(`${item.name} permanently deleted.`,'danger');
      logAudit('Admin','Delete',item.type,`Permanently deleted ${item.name} from archive`);
    }catch(err){ toast('Delete failed: '+err.message,'danger'); }
    refreshView('archive');
  });
}

/* ═══════════════════════════════════════════════════════════════════
   FIX: real email delivery.
   Every "send email" action in this admin console used to just write a
   record to an emailLog collection with status:'Sent' and show a
   success toast — no email was ever actually dispatched to anyone.
   This writes a document to the `mail` collection instead, which is
   the exact format Firebase's official "Trigger Email" Firestore
   Extension watches and sends for real, within seconds — genuinely
   real-time, with zero custom backend code required.

   ONE-TIME SETUP (do this once in the Firebase Console, not in code):
     1. Firebase Console → Build → Extensions → Install "Trigger Email"
        (publisher: firebase, extension id: firestore-send-email).
     2. Point it at an SMTP provider (SendGrid, Mailgun, Gmail SMTP,
        etc.) and set its "Email documents collection" to `mail`
        (the default) to match what's written below.
   Until that extension is installed, documents will still be written
   to Firestore (so nothing crashes and the audit trail stays accurate)
   but no email will physically leave your Firebase project.
   ═══════════════════════════════════════════════════════════════════ */
async function queueEmail({to, subject, html, text}){
  await db.collection('mail').add({
    to: [to],
    message: {
      subject,
      html: html || `<p>${(text||subject).replace(/</g,'&lt;')}</p>`,
      text: text || subject
    }
  });
}

async function sendTeacherActivationEmail(id){
  const r = findTeacherActivation(id);
  const link = `${location.origin}${location.pathname.replace(/[^\/]*$/,'')}teacher_portal.html?activate=${r.token}`;
  try{
    await queueEmail({
      to: r.email,
      subject: 'Activate Your SNED-LINK+ Teacher Portal',
      html: `<p>Hi ${esc(r.name)},</p><p>Your SNED-LINK+ Teacher Portal account is ready to activate. Click the link below to set your password and sign in:</p><p><a href="${link}">${link}</a></p><p>This link expires in 24 hours and can only be used once.</p>`
    });
    await updateTeacherActivation(id, {emailSent:true, emailSentAt:new Date().toISOString(), activationMethod:'Email'});
    await db.collection('teacherEmailLog').add({teacherActivationId:r.id,to:r.email,subject:'Activate Your SNED-LINK+ Teacher Portal',status:'Queued',time:new Date().toISOString()});
    toast(`Activation email queued for ${r.email}.`,'success');
    logAudit('Admin','Send','Teacher Access',`Activation email sent to ${r.name}`);
  }catch(err){ toast('Failed to send: '+err.message,'danger'); }
  refreshView('peopleAccess');
}
async function retryTeacherEmail(logId){
  const e = STATE.teacherEmailLog.find(x=>x.id===logId);

    toast('Email resent successfully.','success');
    logAudit('Admin','Send','Teacher Access',`Retried email to ${e.to}`);
  }catch(err){ toast('Retry failed: '+err.message,'danger'); }

}

async function saveParent(id){
  const name=document.getElementById('f-name').value.trim();
  const email=document.getElementById('f-email').value.trim();
  const phone=document.getElementById('f-phone').value.trim();
  const child=document.getElementById('f-child').value;
  const rel=document.getElementById('f-rel')?document.getElementById('f-rel').value:'Guardian';
  if(!name||!email){ toast('Please fill in the required fields.','danger'); return; }
  try{
    if(id){
      await db.collection('parents').doc(id).update({name,email,phone,children:[child],relationship:rel});
      toast('Parent updated successfully.','success');
      logAudit('Admin','Update','Parent',`Updated ${name}`);
    } else {
      // Backend now handles this properly: server-side Admin SDK creates
      // the Firebase Auth account, users/{uid} login profile, parents/{uid}
      // richer record, and the single-use parentActivations token — all in
      // one request. No admin-typed password anywhere — the parent sets
      // their own via parent_portal.html's "Activate my account" screen.
      const student = STATE.students.find(s=>s.name===child);
      if(!student){ toast('Please select a valid student.','danger'); return; }
      const res = await slApiCall('/api/admin/parents', 'POST', {name,email,studentId:student.id,relationship:rel});
      logAudit('Admin','Create','Parent',`Added ${name} (pending activation)`);
      toast('Parent added — activation created. Manage the link/QR from Parent Access & Activation.','success');
    }
  }catch(err){ toast('Save failed: '+(err.message||err),'danger'); return; }
  closeModal();
  refreshView('parents');
}

async function confirmLinkStudent(activationId){
  const r = findActivation(activationId);
  const studentId = document.getElementById('link-student-select').value;
  const rel = document.getElementById('link-rel-select').value;
  const primary = document.getElementById('link-primary').checked;
  const emergency = document.getElementById('link-emergency').checked;
  const student = STATE.students.find(s=>s.id===studentId);
  if(!student){ toast('Please select a valid student.','danger'); return; }
  try{
    await db.collection('parentActivations').doc(activationId).update({
      linkedStudentId:student.id, linkedStudent:student.name, relationship:rel,
      primaryGuardian:primary, emergencyContact:emergency, linkVerified:true, linkedAt:new Date().toISOString()
    });
    toast(`Link Successful — ${r.name} is now linked to ${student.name}.`,'success');
    logAudit('Admin','Link','Parent Access',`Linked ${r.name} to ${student.name} as ${rel}`);
  }catch(err){ toast('Link failed: '+err.message,'danger'); }
  closeModal();
  verifySelectedActivationId = r.id;
  paTab='verify';
  refreshView('peopleAccess');
}
function removeStudentLink(activationId){

      await db.collection('parentActivations').doc(activationId).update({linkedStudentId:null, linkedStudent:'—', linkVerified:false});

      logAudit('Admin','Unlink','Parent Access',`Removed student link for ${r.name}`);
    }catch(err){ toast('Failed: '+err.message,'danger'); }
    refreshView('peopleAccess');

function activationHistorySteps(r){

    {label:'App Downloaded', at:r.appDownloadCompletedAt, done:['Completed','Installed'].includes(r.appDownloadStatus)},

async function simulateAppDownload(id){

      await db.collection('parentActivations').doc(id).update({appDownloadStatus:'Started', appDownloadStartedAt:now});

      logAudit('Admin','Update','Parent App Distribution',`${r.name} started app download (demo)`);
    } else if(r.appDownloadStatus==='Started'){

      toast(`${r.name} finished downloading the app (demo).`,'success');
      logAudit('Admin','Update','Parent App Distribution',`${r.name} completed app download (demo)`);
    } else if(r.appDownloadStatus==='Completed'){
      await db.collection('parentActivations').doc(id).update({appDownloadStatus:'Installed'});
      toast(`${r.name} installed the app (demo).`,'success');
      logAudit('Admin','Update','Parent App Distribution',`${r.name} installed the app (demo)`);

function simulateLoginCheck(id){
  const r = findActivation(id);
  const checks = [
    {label:'Email matches record', pass:true},
    {label:'Password verified', pass: r.accountStatus!=='Locked'},
    {label:'OTP verified (if enabled)', pass: r.accountStatus!=='Suspended'},
    {label:'Parent account status is Active', pass: r.accountStatus==='Active'},
    {label:'Parent ID validated', pass: !!r.parentId},
    {label:'Linked student found', pass: !!r.linkedStudentId},
    {label:'Device session established', pass: true},
  ];
  const ok = checks.every(c=>c.pass);
  if(ok){
    const now = new Date().toISOString();
    if(!r.firstLoginAt) r.firstLoginAt = now;
    r.lastLogin = now;
  }
  openModal(`Login Authorization — ${esc(r.name)}`, `
    <div style="display:flex;flex-direction:column;gap:9px;margin-bottom:14px;">
      ${checks.map(c=>`<div style="display:flex;align-items:center;gap:9px;font-size:13.5px;">
        <span style="color:${c.pass?'#14b8a6':'#dc2626'};display:flex;width:16px;height:16px;">${c.pass?ICO.check:ICO.x}</span><span>${c.label}</span>
      </div>`).join('')}
    </div>
    ${ok ? `<div class="badge active" style="display:block;padding:10px 14px;line-height:1.5;">All checks passed — showing ${esc(r.linkedStudent)}'s linked information on the Parent Dashboard.</div>`

function openEditStudent(id){

  openModal('Edit Student', studentFormHTML(s), `

function riskFromSupport(support){
  return support==='High Support'?'High':support==='Moderate Support'?'Moderate':'Low';
}
async function saveStudent(id){
  const name=document.getElementById('f-name').value.trim();
  const grade=document.getElementById('f-grade').value;
  const section=document.getElementById('f-section').value;
  const condition=document.getElementById('f-cond').value;
  const support=document.getElementById('f-support').value;
  const teacherId=document.getElementById('f-teacher').value || null;
  const teacherObj=STATE.teachers.find(t=>t.id===teacherId);
  const teacher=teacherObj?teacherObj.name:'';
  const parent=document.getElementById('f-parent').value;
  const dob=document.getElementById('f-dob').value;
  const gender=document.getElementById('f-gender').value;
  if(!name){ toast('Please enter the student\'s name.','danger'); return; }
  const risk = riskFromSupport(support);
  try{
    if(id){
      await db.collection('students').doc(id).update({name,grade,section,condition,support,teacher,teacherId,parent,dob,gender,risk});
      toast('Student updated successfully.','success');
      logAudit('Admin','Update','Student',`Updated ${name}`);
    } else {
      // Numeric string id (not a Firestore auto-id) + teacherId/parentUids/
      // logs/photos/archived — this is the exact shape the Teacher and
      // Parent portals expect, so a student created here shows up for
      // their assigned teacher immediately, live.
      const numId = Date.now() + Math.floor(Math.random()*1000);
      await db.collection('students').doc(String(numId)).set({
        id:numId, name,grade,section,condition,support,teacher,teacherId,parent,dob,gender,risk,
        archived:false, logs:[], photos:[], parentUids:[],
      });
      toast('Student added successfully.'+(teacherId?' Their teacher will see them immediately.':' Assign a teacher so they can see this student.'),'success');
      logAudit('Admin','Create','Student',`Added ${name}`);
    }
  }catch(err){ toast('Save failed: '+err.message,'danger'); return; }
  closeModal();
  refreshView('students');
}

async function reassign(studentId){
  const s = STATE.students.find(x=>x.id===studentId);
  if(!s){
    // The row's underlying student record is no longer in STATE (e.g. it
    // was deleted/archived, or the list refreshed between render and
    // click). Re-render instead of crashing on s.name below.
    toast('That student record changed — refreshing the list.','danger');
    refreshView('assignments');
    return;
  }
  const sel = document.getElementById(`new-${assignTab}-${studentId}`);
  if(!sel){
    toast('Could not find the assignment dropdown for this row. Refreshing.','danger');
    refreshView('assignments');
    return;

  const val = sel.value;
  const field = assignTab==='teacher' ? 'teacher' : 'parent';
  try{
    await db.collection('students').doc(studentId).update({[field]:val});

  }[x.status] ?? 0;

      <div class="list-row"><span class="muted">Teacher Response</span><span><span class="badge ${x.aiOutcome==='Accepted'?'active':x.aiOutcome==='Rejected'?'inactive':x.aiOutcome==='Modified'?'info':'pending'}">${x.aiOutcome}</span></span></div>
      <div class="list-row"><span class="muted">Confidence Score</span><span class="mono">${x.aiConfidence!==null?x.aiConfidence+'%':'—'}</span></div>
      <p class="muted" style="margin-top:14px;line-height:1.6;">The Admin can monitor AI usage on every IEP, but only the Teacher may accept, modify, reject, or otherwise act on an AI recommendation.</p>`,
  }[iepModalTab];
  openModal(`IEP — ${esc(x.student)}`, `
    <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px;font-size:13.5px;">
      <div><span class="muted">Teacher</span><br>${esc(x.teacher)}</div>

    ${paginationBar('iepSchedule', page, pages, total, pageRows.length)}

function sendIepReminder(id, target){
  const x = STATE.ieps.find(r=>r.id===id);
  const who = target==='teacher' ? x.teacher : x.parent;
  toast(`Reminder sent to ${who}.`,'success');
  logAudit('Admin','Send','IEP',`Sent review reminder to ${who} for ${x.student}`);
  refreshView('iep');
}

async function uploadIepDocument(){
  const iepId = document.getElementById('iep-up-student').value;
  const type = document.getElementById('iep-up-type').value;
  const input = document.getElementById('iep-up-file');
  const file = input && input.files && input.files[0];
  const x = STATE.ieps.find(r=>r.id===iepId);
  if(!file){ toast('Please choose a file to upload.','error'); return; }
  const ext = (file.name.split('.').pop()||'').toUpperCase();
  if(!['PDF','DOCX','JPG','JPEG','PNG'].includes(ext)){ toast('Unsupported format. Allowed: PDF, DOCX, JPG, PNG.','error'); return; }
  const sizeMB = Math.round((file.size/1048576)*10)/10;
  if(sizeMB > IEP_DOC_MAX_MB){ toast('File exceeds the 20MB limit.','error'); return; }
  const existing = STATE.iepDocs.filter(d=>d.iepId===iepId && d.type===type && !d.archived);
  const prev = STATE.iepDocs.filter(d=>d.iepId===iepId && d.type===type);
  const nextV = 'v'+(prev.length+1)+'.0';
  const uploadDate = new Date().toISOString();
  const newDoc = {
    iepId, student:x.student, learnerId:x.learnerId, teacher:x.teacher, schoolYear:x.schoolYear,
    type, version:nextV, uploadedBy:STATE.admin.name||'Admin', uploadDate,
    sizeMB: sizeMB||0.1, status:'Uploaded', archived:false,
    versions:[...(existing[0]? existing[0].versions.map(v=>({...v, status:'Archived'})) : []),
      {version:nextV, uploadedBy:STATE.admin.name||'Admin', date:uploadDate, status:'Current'}],
  };
  try{
    const batch = db.batch();
    existing.forEach(d=>{
      batch.update(db.collection('iepDocs').doc(d.id), {
        status:'Replaced',
        versions: d.versions.map(v=> v.status==='Current' ? {...v, status:'Archived'} : v)
      });
    });
    const newDocRef = db.collection('iepDocs').doc();
    batch.set(newDocRef, newDoc);
    batch.update(db.collection('ieps').doc(iepId), {
      uploadHistory: firebase.firestore.FieldValue.arrayUnion({docId:newDocRef.id, type, version:nextV, by:STATE.admin.name||'Admin', date:uploadDate}),
      docStatus: 'Pending Verification',
      timeline: firebase.firestore.FieldValue.arrayUnion({date:uploadDate, event:`${type} uploaded (${nextV})`}),
    });
    await batch.commit();
    input.value = '';
    toast(`${type} uploaded for ${x.student} as ${nextV}.`,'success');
    logAudit('Admin','Upload','IEP Documents',`Uploaded ${type} ${nextV} for ${x.student}`);
  }catch(err){ toast('Upload failed: '+err.message,'danger'); }
  refreshView('iep');
}

async function saveIepSettings(){
  const patch = {
    reviewFrequency: document.getElementById('iep-s-freq').value,
    notificationTiming: document.getElementById('iep-s-notif').value,
    templateVersion: document.getElementById('iep-s-tpl').value.trim(),
    aiAvailability: document.getElementById('iep-s-ai').value,
    archivePolicy: document.getElementById('iep-s-arch').value,
  };
  STATE.iepSettings = patch;
  try{
    await db.collection('settings').doc('iep').set(patch, {merge:true});
    toast('IEP settings saved.','success');
    logAudit('Admin','Update','IEP Settings','Updated IEP process configuration');
  }catch(err){ toast('Save failed: '+err.message,'danger'); }
  refreshView('iep');
}

async function sendNotification(){
  const type=document.getElementById('n-type').value;
  const title=document.getElementById('n-title').value.trim();
  const body=document.getElementById('n-body').value.trim();
  const toTeachers=document.getElementById('n-teachers').checked;
  const toParents=document.getElementById('n-parents').checked;
  const targetEl=document.getElementById('n-target-student');
  const sid = targetEl && targetEl.value ? Number(targetEl.value) : null;
  if(!title||!body){ toast('Please fill in title and message.','danger'); return; }
  try{
    // Backend now handles this properly — POST /api/alerts and
    // /api/notifications do the Firestore write AND send the actual FCM
    // push in one request (eventService.js), which a plain client-side
    // addDoc() can never do (Express has no way to react to a Firestore
    // write the way a Cloud Function trigger could). The 'alerts' /
    // 'notifications' entries in FIRESTORE_COLLECTIONS still pick this up
    // in real time for the dashboard the instant the backend writes it.
    if(type==='Alert'){
      await slApiCall('/api/alerts', 'POST', {
        title, desc:body, severity:'High', sid, teacherId: null
      });
    } else {
      await slApiCall('/api/notifications', 'POST', {
        title, desc:body, sid, teacherId:null, forParents:toParents, category:'general'
      });
    }
    toast('Notification sent'+(type==='Alert'?' — pushing to devices now.':' successfully.'),'success');
    logAudit('Admin','Create','Notification',`Sent "${title}"`);
  }catch(err){ toast('Send failed: '+err.message,'danger'); return; }
  closeModal();
  notifFilter='All';
  refreshView('notifications');
}

/* ---------------- Boot / auth-state wiring ---------------- */
let authHandledManually = false;
let suppressAutoAuthHandling = false;
function boot(){
  if (!FIREBASE_CONFIGURED){ showConfigNeededScreen(); return; }
  auth.onAuthStateChanged(async (user)=>{
    if (suppressAutoAuthHandling) return;
    if (user){
      const isAdmin = await loadAdminProfile(user);
      if (!isAdmin){
        stopRealtimeSync();
        STATE.session.loggedIn = false;
        await auth.signOut().catch(()=>{});
        showLoginScreen('This account is not registered as an administrator on SNED-LINK+.');
        return;
      }
      STATE.session.loggedIn = true;
      startRealtimeSync();
      afterLoginCheck();
    } else {
      stopRealtimeSync();
      STATE.session.loggedIn = false;
      if (authHandledManually){ authHandledManually = false; return; }
      checkFirstRun();
    }
  });
}
async function loadAdminProfile(user){
  let isAdmin = false;
  try{
    const doc = await db.collection('admins').doc(user.uid).get();
    if (doc.exists){
      STATE.admin = {...STATE.admin, ...doc.data(), email:user.email};
      isAdmin = true;
    } else {
      // Not in the legacy admins/ collection — check the shared users/
      // collection too, so an admin created from the Teacher Portal's
      // Admin Console (which only writes to users/) can also log in here.
      const udoc = await db.collection('users').doc(user.uid).get();
      if (udoc.exists && udoc.data().role === 'admin' && udoc.data().status !== 'suspended' && udoc.data().status !== 'inactive'){
        const ud = udoc.data();
        STATE.admin = {...STATE.admin, name: ud.name, email: user.email};
        isAdmin = true;
        // Mirror them into admins/ too, so the rest of this app's existing
        // admins-collection code paths (profile fields, lastLogin, etc.)
        // keep working exactly as before.
        await db.collection('admins').doc(user.uid).set({
          name: ud.name, email: user.email, role:'System Administrator',
          phone:'', school:'', address:'', termsAccepted:false, termsVersion:null,
          termsAcceptedAt:null, createdAt: new Date().toISOString(),
        }, {merge:true}).catch(()=>{});
      }
    }
  }catch(err){ console.error('Failed to load admin profile:', err); }
  if (!isAdmin) return false;
  STATE.admin.lastLogin = new Date().toISOString();
  db.collection('admins').doc(user.uid).set({lastLogin: STATE.admin.lastLogin}, {merge:true}).catch(()=>{});
  db.collection('users').doc(user.uid).set({lastLogin: STATE.admin.lastLogin}, {merge:true}).catch(()=>{});
  return true;
}
async function checkFirstRun(){
  // FIX: ensureDefaultAdminExists() and provisionDefaultAdmin() were fully
  // wired up (including the fallback to showSetupScreen()) but nothing
  // ever called them — so a brand-new project with zero admin accounts
  // landed on a bare login form with no way to sign in and no way to
  // create the first account. Auto-create/repair the guaranteed default
  // admin first, then decide which screen to show.
  await ensureDefaultAdminExists();
  try{
    const snap = await db.collection('admins').limit(1).get();
    const usnap = await db.collection('users').where('role','==','admin').limit(1).get();
    if(snap.empty && usnap.empty){
      // Still no admin account of any kind (auto-create silently failed
      // and there's nothing to fall back on yet) — go straight to manual
      // setup instead of a login form nobody can use.
      showSetupScreen();
      return;
    }
  }catch(err){
    console.error('checkFirstRun: could not check for an existing admin:', err);
  }
  showLoginScreen();
}

/* Makes sure DEFAULT_ADMIN_EMAIL exists in Firebase Auth even when other
   admin accounts already exist — creating an account also signs the
   browser in as that account, so this signs back out immediately
   afterward to avoid hijacking whatever session the person actually
   looking at the login screen is about to start. Silent no-op if the
   fixed account already exists (the normal case after its first run). */
async function ensureDefaultAdminExists(){
  try{
    const methods = await auth.fetchSignInMethodsForEmail(DEFAULT_ADMIN_EMAIL);
    if (methods && methods.length) return; // already exists — nothing to do
    suppressAutoAuthHandling = true;
    const cred = await auth.createUserWithEmailAndPassword(DEFAULT_ADMIN_EMAIL, DEFAULT_ADMIN_PASSWORD);
    await cred.user.updateProfile({displayName:'System Administrator'});
    await db.collection('admins').doc(cred.user.uid).set({
      name:'System Administrator', email: DEFAULT_ADMIN_EMAIL, role:'System Administrator',
      phone:'', school:'', address:'',
      termsAccepted:false, termsVersion:null, termsAcceptedAt:null,
      createdAt:new Date().toISOString(),
    });
    await db.collection('users').doc(cred.user.uid).set({
      name:'System Administrator', email: DEFAULT_ADMIN_EMAIL, role:'admin', status:'active', fcmTokens:[],
      createdAt:new Date().toISOString(),
    }, {merge:true});
    await auth.signOut();
    suppressAutoAuthHandling = false;
    console.info('Default admin account created as a guaranteed fallback login.');
  }catch(err){
    suppressAutoAuthHandling = false;
    console.error('Could not ensure default admin account exists:', err);
  }
}
/* FIX: this used to always show a manual "create the first admin" form
   that required someone to type in a name/email/password before the
   portal was usable at all. Now the very first visit auto-creates ONE
   fixed, known admin account — see DEFAULT_ADMIN_EMAIL/PASSWORD above —
   so there's a guaranteed way in from day one. Falls back to the old
   manual form only if the auto-create itself fails (e.g. that email is
   somehow already taken by a non-admin account). */
async function provisionDefaultAdmin(){
  try{
    suppressAutoAuthHandling = true;
    const cred = await auth.createUserWithEmailAndPassword(DEFAULT_ADMIN_EMAIL, DEFAULT_ADMIN_PASSWORD);
    await cred.user.updateProfile({displayName:'System Administrator'});
    await db.collection('admins').doc(cred.user.uid).set({
      name:'System Administrator', email: DEFAULT_ADMIN_EMAIL, role:'System Administrator',
      phone:'', school:'', address:'',
      termsAccepted:false, termsVersion:null, termsAcceptedAt:null,
      createdAt:new Date().toISOString(),
    });
    // Mirror into the shared users/{uid} collection (role:'admin') so this
    // same login also works in the Teacher Portal's Admin Console and is
    // recognized by the shared backend / push notification system.
    await db.collection('users').doc(cred.user.uid).set({
      name:'System Administrator', email: DEFAULT_ADMIN_EMAIL, role:'admin', status:'active', fcmTokens:[],
      createdAt:new Date().toISOString(),
    }, {merge:true});
    suppressAutoAuthHandling = false;
    // Run the normal post-login sequence, same as a real login would.
    await loadAdminProfile(cred.user);
    STATE.session.loggedIn = true;
    startRealtimeSync();
    afterLoginCheck();
    // Land directly on Change Password with the default credentials
    // spelled out, so changing it is the obvious next action rather
    // than something easy to forget.
    setTimeout(()=>{
      navigate('changepassword');
      toast(`Default admin account created (${DEFAULT_ADMIN_EMAIL}). Please set a real password now — this default should only be used once.`, 'success');
    }, 300);
  }catch(err){
    suppressAutoAuthHandling = false;
    console.error('Default admin auto-provision failed, falling back to manual setup:', err);
    showSetupScreen('Could not auto-create the default admin account — it may already exist under a different role, or that email is taken. Please create one manually.');
  }
}

async function submitSetup(){
  const name = document.getElementById('setup-name').value.trim();
  const email = document.getElementById('setup-email').value.trim();
  const pass = document.getElementById('setup-pass').value;
  const pass2 = document.getElementById('setup-pass2').value;
  if(!name || !email || !pass){ toast('Please fill in every field.','danger'); return; }
  if(pass.length < 8){ toast('Password must be at least 8 characters.','danger'); return; }
  if(pass !== pass2){ toast('Passwords do not match.','danger'); return; }
  try{
    const snap = await db.collection('admins').limit(1).get();
    const usnap = await db.collection('users').where('role','==','admin').limit(1).get();
    if(!snap.empty || !usnap.empty){ toast('An administrator already exists. Please log in.','danger'); showLoginScreen(); return; }
    suppressAutoAuthHandling = true;
    const cred = await auth.createUserWithEmailAndPassword(email, pass);
    await cred.user.updateProfile({displayName:name});
    await db.collection('admins').doc(cred.user.uid).set({
      name, email, role:'System Administrator', phone:'', school:'', address:'',
      termsAccepted:false, termsVersion:null, termsAcceptedAt:null,
      createdAt:new Date().toISOString(),
    });
    // Mirror into the shared users/{uid} collection (role:'admin') so this
    // same login also works in the Teacher Portal's Admin Console and is
    // recognized by the shared Cloud Functions / push notification system.
    await db.collection('users').doc(cred.user.uid).set({
      name, email, role:'admin', status:'active', fcmTokens:[],
      createdAt: new Date().toISOString(),
    }, {merge:true});
    suppressAutoAuthHandling = false;
    // Now that the profile doc exists, run the normal post-login sequence ourselves.
    await loadAdminProfile(cred.user);
    STATE.session.loggedIn = true;
    startRealtimeSync();
    afterLoginCheck();
  }catch(err){
    suppressAutoAuthHandling = false;
    toast(loginErrorMessage(err), 'danger');
  }
}
